<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DNode E1 — Author kit</title><style>body{font:16px system-ui;max-width:850px;margin:60px auto;padding:25px;background:#f2f3ed;color:#203b2e}h1{font-size:44px}textarea,pre{width:100%;padding:15px;box-sizing:border-box;border:1px solid #b9c8b4;border-radius:8px}button,a{display:inline-block;padding:12px 18px;background:#244b3d;color:white;border:0;border-radius:8px;margin:10px 0}pre{background:white;white-space:pre-wrap}p{line-height:1.7}</style><h1>DNode E1 author kit.</h1><p>The same runtime and shared roots for every author. Reference shop/game implementations are deliberately absent. Start with the blueprint and generated dictionary.</p><a href="generated/DICTIONARY.md">Generated dictionary</a><p>Optional application root: <input id="source" type="file" accept=".node"></p><label>Node name <input id="name" value="bounded.clamp"></label><p>Arguments as JSON:</p><textarea id="args">[12,0,10]</textarea><button id="run">Execute through runtime →</button><pre id="result">Verifying shared distribution…</pre><script type="module">
import{compile,Runtime}from'./runtime/engine.js';import{verifyBundle}from'./runtime/admission.js';const read=async p=>{const r=await fetch(p);if(!r.ok)throw Error('Missing '+p);return r.text()};try{const {texts}=await verifyBundle(read,JSON.parse(await read('generated/trust-key.json')));const sources=Object.entries(texts).filter(([p])=>p.startsWith('roots/')&&p.endsWith('.node')).map(([,s])=>s);const profile=JSON.parse(texts['profiles/browser.json']);document.querySelector('#result').textContent='Verified. Choose a node and run.';document.querySelector('#run').onclick=async()=>{try{const f=document.querySelector('#source').files[0];const g=compile(f?[...sources,await f.text()]:sources);const r=new Runtime(g,profile);document.querySelector('#result').textContent=JSON.stringify(r.run(document.querySelector('#name').value,JSON.parse(document.querySelector('#args').value)),null,2)}catch(e){document.querySelector('#result').textContent=e.kind+': '+e.message}}}catch(e){document.querySelector('#result').textContent='Admission failed: '+e.message}
</script></html>
