<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Văn phòng phẩm</title>
<style>
/* C-S2 r2 tokens: single column, 560px max, 16px gutters, 8px grid. */
:root{--bg:#FAF8F5;--ink:#1C1B1A;--muted:#55524E;--line:#E2DDD5;--card:#FFFFFF;--primary:#1F4E79;--primary-ink:#FFFFFF;
 --ok:#1E6B3A;--ok-bg:#EAF4EE;--bad:#A1281E;--bad-bg:#FBECEA;--wait:#33547A;--wait-bg:#EEF3F8;--neutral:#5B5B5B;--neutral-bg:#F1EFEC;--warn:#7A4E00}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/24px system-ui,"Segoe UI",Roboto,"Noto Sans",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{border-bottom:1px solid var(--line);background:var(--card)}
header .wrap{display:flex;justify-content:space-between;align-items:center;min-height:56px;gap:8px}
header a{color:var(--ink);text-decoration:none;font-weight:600}
header a.cart{border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:44px;display:inline-flex;align-items:center}
main{padding:16px 0 32px}
h1{font-size:22px;line-height:28px;margin:8px 0}
h2{font-size:20px;line-height:28px;margin:24px 0 8px}
p{margin:8px 0}
.note{color:var(--muted);font-size:14px;line-height:20px}
.ref{color:var(--muted);margin:4px 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin:8px 0}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.row .amt{white-space:nowrap;font-weight:600}
.product h3{font-size:18px;line-height:24px;margin:0}
.product .price{font-weight:600}
.product.soldout{opacity:.75}
.stepper{display:flex;align-items:center;gap:8px;margin-top:8px}
.stepper button{width:48px;height:48px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:22px;color:var(--ink)}
.stepper button:disabled{opacity:.4}
.stepper .qty{min-width:32px;text-align:center;font-weight:600}
.warn{color:var(--warn);font-weight:600}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 8px;gap:16px}
.total .amt{font-size:28px;line-height:34px;font-weight:600;white-space:nowrap}
button.btn{display:block;width:100%;min-height:48px;border-radius:8px;font-weight:600;font-size:16px;line-height:22px;font-family:inherit;padding:12px 16px;margin:8px 0;cursor:pointer}
button.primary{background:var(--primary);color:var(--primary-ink);border:0}
button.secondary{background:transparent;color:var(--primary);border:1px solid var(--primary)}
button.btn:disabled{opacity:.6;cursor:default}
.status{display:flex;gap:16px;align-items:flex-start;border-radius:8px;padding:16px;margin:8px 0;border:2px solid}
.status svg{flex:0 0 40px;width:40px;height:40px}
.status h2{margin:0 0 4px;font-size:22px;line-height:28px}
.status p{margin:4px 0}
.status.confirmed{border-color:var(--ok);background:var(--ok-bg)} .status.confirmed h2{color:var(--ok)}
.status.declined{border-color:var(--bad);background:var(--bad-bg)} .status.declined h2{color:var(--bad)}
.status.unknown,.status.pending{border-style:dashed;border-color:var(--wait);background:var(--wait-bg)} .status.unknown h2,.status.pending h2{color:var(--wait)}
.status.ready{border-color:var(--primary);background:var(--card)} .status.ready h2{color:var(--primary)}
.status.cancelled{border-color:var(--neutral);background:var(--neutral-bg)} .status.cancelled h2{color:var(--neutral)}
.notice{border-left:4px solid var(--bad);background:var(--bad-bg);padding:12px 16px;border-radius:4px;margin:8px 0}
a.order{display:block;color:inherit;text-decoration:none}
.pill{font-size:14px;line-height:20px;border-radius:999px;padding:2px 10px;border:1px solid currentColor;white-space:nowrap}
.pill.confirmed{color:var(--ok)} .pill.declined{color:var(--bad)} .pill.unknown,.pill.pending{color:var(--wait);border-style:dashed} .pill.ready{color:var(--primary)} .pill.cancelled{color:var(--neutral)}
footer{border-top:1px solid var(--line);padding:16px 0 32px;color:var(--muted);font-size:14px}
footer a{color:var(--muted)}
/* Test desk (English, diagnostics only) */
.desk{font-size:14px;line-height:20px}
.desk h1{font-size:22px}
.desk h2{font-size:17px;margin-top:24px}
.desk table{border-collapse:collapse;width:100%;margin:8px 0;font-variant-numeric:tabular-nums}
.desk th,.desk td{border:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top;word-break:break-word}
.desk .scroll{overflow-x:auto}
.desk code,.desk pre{font:12px/16px ui-monospace,Menlo,Consolas,monospace;word-break:break-all;white-space:pre-wrap}
.desk label{display:inline-flex;gap:6px;align-items:center;margin:4px 12px 4px 0;min-height:32px}
.desk button.small{min-height:36px;padding:6px 12px;margin:4px 8px 4px 0;border-radius:6px;border:1px solid var(--primary);background:var(--card);color:var(--primary);font-weight:600;font-size:14px;line-height:20px;font-family:inherit}
.desk .ok{color:var(--ok);font-weight:600} .desk .bad{color:var(--bad);font-weight:600}
.fatal{max-width:560px;margin:48px auto;padding:16px}
</style>
</head>
<body>
<header><div class="wrap"><a href="#/" id="brand">Văn phòng phẩm</a><a href="#/cart" class="cart" id="cartlink">Giỏ hàng</a></div></header>
<main><div class="wrap" id="app" aria-live="polite"><p>Đang tải…</p></div></main>
<footer><div class="wrap"><a href="#/test-desk" id="desklink">Test desk</a></div></footer>
<script type="module" src="app.js"></script>
</body>
</html>
