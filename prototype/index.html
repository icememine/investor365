<title>Investor365 Learn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Layout: flow index on the left, one phone-sized app on the right; at phone width the app fills the screen and the index becomes a chip row. */
:root{
  --page:#E8EFEB; --surface:#FFFFFF; --sunken:#F3F7F5; --ink:#15302A; --muted:#647A72; --line:#D9E4DF;
  --jade:#16A571; --jade-deep:#0D7D55; --jade-soft:#D8F3E7;
  --gold:#F0AE2E; --gold-deep:#C2850E; --gold-soft:#FFF1D2;
  --coral:#E4474D; --coral-deep:#B3303A; --coral-soft:#FDE3E3;
  --sky:#2C86D1; --sky-deep:#1D669F; --sky-soft:#DDEEFB;
  --locked:#E3E9E6; --locked-deep:#C3CEC9; --frame:#15302A;
  --f-display:"Baloo 2","Nunito",ui-rounded,system-ui,sans-serif;
  --f-body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#08110E; --surface:#111D19; --sunken:#182722; --ink:#E6F0EB; --muted:#8FA59D; --line:#25372F;
  --jade:#27BF86; --jade-deep:#137E58; --jade-soft:#123A2C;
  --gold:#F4B840; --gold-deep:#A87310; --gold-soft:#3A2D10;
  --coral:#F0626A; --coral-deep:#A8323B; --coral-soft:#3D1A1D;
  --sky:#4C9EE3; --sky-deep:#28689F; --sky-soft:#13283A;
  --locked:#22322C; --locked-deep:#17241F; --frame:#2A3D36; color-scheme:dark;}}
:root[data-theme="dark"]{
  --page:#08110E; --surface:#111D19; --sunken:#182722; --ink:#E6F0EB; --muted:#8FA59D; --line:#25372F;
  --jade:#27BF86; --jade-deep:#137E58; --jade-soft:#123A2C;
  --gold:#F4B840; --gold-deep:#A87310; --gold-soft:#3A2D10;
  --coral:#F0626A; --coral-deep:#A8323B; --coral-soft:#3D1A1D;
  --sky:#4C9EE3; --sky-deep:#28689F; --sky-soft:#13283A;
  --locked:#22322C; --locked-deep:#17241F; --frame:#2A3D36; color-scheme:dark;}

html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:24px;box-sizing:border-box}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.15}
p{margin:0}

.stage{display:grid;grid-template-columns:260px auto;gap:40px;justify-content:center;align-items:start;max-width:1100px;margin:0 auto;height:100%}
.index{position:sticky;top:0;display:flex;flex-direction:column;gap:18px;padding-top:8px}
.index h1{font-size:28px;font-weight:800}
.index .lede{color:var(--muted);font-size:14px;max-width:34ch}
.index .group{display:flex;flex-direction:column;gap:2px}
.index .group-label{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.flow-link{display:flex;gap:10px;align-items:center;text-align:left;background:none;border:0;padding:7px 10px;border-radius:10px;font-weight:700;font-size:14px}
.flow-link:hover{background:var(--surface)}
.flow-link[aria-current="true"]{background:var(--jade-soft);color:var(--jade-deep)}
:root[data-theme="dark"] .flow-link[aria-current="true"]{color:var(--jade)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .flow-link[aria-current="true"]{color:var(--jade)}}
.flow-link .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;width:18px}
.index .note{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}

.phone{width:390px;height:min(800px,calc(100vh - 48px));min-height:620px;background:var(--surface);border:10px solid var(--frame);border-radius:44px;position:relative;overflow:hidden;box-shadow:0 30px 60px -30px rgba(10,40,30,.45)}
.app{position:absolute;inset:0;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0}

@media (max-width:760px){
  body{padding-inline:0;padding-block:0}
  .stage{grid-template-columns:1fr;gap:0;height:100%;display:flex;flex-direction:column;align-items:stretch}
  .index{position:static;padding:12px 16px 10px;gap:8px;background:var(--page);min-width:0}
  .index .groups{min-width:0}
  .index h1,.index .lede,.index .note,.index .group-label{display:none}
  .index .groups{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
  .index .group{flex-direction:row;gap:6px}
  .flow-link{white-space:nowrap;background:var(--surface);padding:6px 12px}
  .phone{width:100%;flex:1;height:auto;min-height:0;border:0;border-radius:0;box-shadow:none}
}

/* ---------- shared bits ---------- */
.ico{width:22px;height:22px;flex:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:16px;padding:14px 18px;font-family:var(--f-body);font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;background:var(--jade);color:#fff;box-shadow:0 4px 0 var(--jade-deep);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--jade-deep)}
.btn[disabled]{background:var(--locked);color:var(--muted);box-shadow:0 4px 0 var(--locked-deep);cursor:default}
.btn.ghost{background:var(--surface);color:var(--sky);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.coral{background:var(--coral);box-shadow:0 4px 0 var(--coral-deep)}
.btn.sky{background:var(--sky);box-shadow:0 4px 0 var(--sky-deep)}
.linkbtn{background:none;border:0;font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-size:13px;padding:10px}
.pad{padding:20px}
.stack{display:flex;flex-direction:column;gap:12px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;border-radius:999px;padding:4px 10px;background:var(--sunken);color:var(--muted)}
.src{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.src b{color:inherit}

/* ---------- onboarding ---------- */
.ob{display:flex;flex-direction:column;height:100%;padding:24px 20px 24px}
.ob-top{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.ob-top .bar{flex:1}
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px}
.welcome h2{font-size:30px;font-weight:800}
.welcome p{color:var(--muted);max-width:30ch}
.mascot-row{display:flex;gap:12px;align-items:flex-end}
.bubble{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 14px;font-weight:700;font-size:15px}
.bubble::before{content:"";position:absolute;left:-9px;bottom:16px;width:14px;height:14px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.choice{display:flex;align-items:center;gap:14px;text-align:left;border:2px solid var(--line);border-radius:16px;background:var(--surface);padding:12px 14px;box-shadow:0 3px 0 var(--line);font-weight:700}
.choice small{display:block;color:var(--muted);font-weight:600;font-size:13px}
.choice .badge{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.choice[aria-pressed="true"]{border-color:var(--sky);background:var(--sky-soft);box-shadow:0 3px 0 var(--sky)}
.choice .right{margin-left:auto;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.ob-foot{margin-top:auto;padding-top:16px}

/* ---------- top status bar ---------- */
.status{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;border-bottom:2px solid var(--line);background:var(--surface)}
.stat{display:flex;align-items:center;gap:4px;font-weight:800;font-variant-numeric:tabular-nums;background:none;border:0;padding:4px 6px;border-radius:10px}
.stat.fire{color:var(--gold-deep)} .stat.xp{color:var(--sky)} .stat.heart{color:var(--coral)}
.course-chip{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:12px;padding:4px 10px 4px 6px;background:var(--surface);font-weight:800;font-size:13px}
.course-chip .fund{width:24px;height:24px;border-radius:7px;background:var(--jade);display:grid;place-items:center;color:#fff;font-size:10px;font-weight:800}

/* ---------- path ---------- */
.unit{margin:16px 16px 4px;border-radius:18px;padding:16px 18px;color:#fff;display:flex;align-items:center;gap:12px}
.unit h3{font-size:19px;font-weight:800}
.unit p{font-size:13px;opacity:.92;font-weight:600}
.unit .guide{margin-left:auto;flex:none;border:2px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;border-radius:12px;padding:8px 10px;font-weight:800;font-size:12px;letter-spacing:.05em;text-transform:uppercase}
.unit.u1{background:var(--jade);box-shadow:0 4px 0 var(--jade-deep)}
.unit.u2{background:var(--sky);box-shadow:0 4px 0 var(--sky-deep)}
.unit.u3{background:var(--gold-deep);box-shadow:0 4px 0 #8a5f0a}
.unit.locked{filter:saturate(.25);opacity:.75}
.path{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px;padding:26px 0 30px}
.node-wrap{position:relative}
.node{width:70px;height:64px;border-radius:50%;border:0;display:grid;place-items:center;position:relative;transition:transform .08s}
.node:active{transform:translateY(4px)}
.node.done{background:var(--gold);box-shadow:0 7px 0 var(--gold-deep);color:#fff}
.node.current{background:var(--jade);box-shadow:0 7px 0 var(--jade-deep);color:#fff}
.node.locked{background:var(--locked);box-shadow:0 7px 0 var(--locked-deep);color:var(--muted)}
.node.chest,.node.trophy{border-radius:18px}
.node .ico{width:30px;height:30px}
.ring{position:absolute;inset:-10px;border-radius:50%;border:5px solid var(--jade-soft);pointer-events:none}
.start-tip{position:absolute;bottom:calc(100% + 14px);left:50%;transform:translateX(-50%);background:var(--surface);border:2px solid var(--line);color:var(--jade);font-weight:800;letter-spacing:.06em;font-size:13px;padding:6px 12px;border-radius:12px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
.start-tip::after{content:"";position:absolute;left:50%;top:100%;width:10px;height:10px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translate(-50%,-5px) rotate(45deg)}
@keyframes bob{50%{transform:translate(-50%,-4px)}}
.path-mascot{position:absolute;right:28px;top:120px;opacity:.95}
.pop{position:absolute;z-index:5;top:calc(100% + 16px);left:50%;transform:translateX(calc(-50% + var(--dx,0px)));width:270px;border-radius:18px;padding:16px;color:#fff;background:var(--jade);box-shadow:0 4px 0 var(--jade-deep)}
.pop.done{background:var(--gold);box-shadow:0 4px 0 var(--gold-deep)}
.pop.locked{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.pop::before{content:"";position:absolute;bottom:100%;left:calc(50% - var(--dx,0px));transform:translateX(-50%);border:10px solid transparent;border-bottom-color:inherit;border-bottom-color:var(--pop-arrow)}
.pop h4{margin:0 0 4px;font-family:var(--f-display);font-size:18px}
.pop p{font-size:13px;opacity:.95;margin-bottom:12px;font-weight:600}
.pop .btn{background:#fff;color:var(--jade-deep);box-shadow:0 4px 0 rgba(0,0,0,.18)}
.pop.done .btn{color:var(--gold-deep)}

/* ---------- tab bar ---------- */
.tabs{display:flex;justify-content:space-around;border-top:2px solid var(--line);background:var(--surface);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:2px solid transparent;border-radius:12px;padding:6px 0;font-size:11px;font-weight:800;color:var(--muted)}
.tab[aria-current="true"]{border-color:var(--sky);background:var(--sky-soft);color:var(--sky)}
.tab .ico{width:24px;height:24px}

/* ---------- lesson ---------- */
.lesson-top{display:flex;align-items:center;gap:12px;padding:16px 16px 8px}
.iconbtn{background:none;border:0;padding:4px;border-radius:10px;color:var(--muted);display:grid;place-items:center}
.bar{height:16px;border-radius:999px;background:var(--locked);overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--jade);border-radius:999px;position:relative;transition:width .35s ease}
.bar i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:4px;background:rgba(255,255,255,.35)}
.q{padding:12px 20px 20px;display:flex;flex-direction:column;gap:16px}
.q-kind{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--sky)}
.q h2{font-size:22px;font-weight:800}
.ctx{background:var(--sunken);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--ink);font-weight:600}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:2px solid var(--line);border-radius:16px;background:var(--surface);padding:12px 14px;box-shadow:0 3px 0 var(--line);font-weight:700;font-size:15px}
.opt .key{flex:none;width:26px;height:26px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.opt[aria-pressed="true"]{border-color:var(--sky);background:var(--sky-soft);box-shadow:0 3px 0 var(--sky)}
.opt[aria-pressed="true"] .key{border-color:var(--sky);color:var(--sky)}
.opt.right{border-color:var(--jade);background:var(--jade-soft);box-shadow:0 3px 0 var(--jade)}
.opt.wrong{border-color:var(--coral);background:var(--coral-soft);box-shadow:0 3px 0 var(--coral)}
.opt[disabled]{cursor:default}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf .opt{flex-direction:column;align-items:center;justify-content:center;padding:22px 10px;font-size:18px;font-family:var(--f-display)}
.tf .opt .ico{width:34px;height:34px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:10px}
.tile{min-height:58px;border:2px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:0 3px 0 var(--line);font-weight:800;font-size:14px;padding:8px;text-align:center}
.tile[aria-pressed="true"]{border-color:var(--sky);background:var(--sky-soft);box-shadow:0 3px 0 var(--sky);color:var(--sky)}
.tile.ok{border-color:var(--jade-soft);background:var(--jade-soft);color:var(--jade);box-shadow:none;opacity:.7;cursor:default}
.tile.bad{border-color:var(--coral);background:var(--coral-soft);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.calc{display:flex;flex-direction:column;gap:10px}
.calc-row{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:16px;padding:6px 14px;background:var(--sunken)}
.calc-row input{flex:1;min-width:0;border:0;background:none;font-family:var(--f-display);font-size:30px;font-weight:800;color:var(--ink);padding:6px 0;font-variant-numeric:tabular-nums}
.calc-row input:focus{outline:none}
.calc-row:focus-within{border-color:var(--sky)}
.calc-row span{font-weight:800;color:var(--muted)}
.calc .hint{font-size:13px;color:var(--muted);font-weight:600}
.chat{display:flex;gap:10px;align-items:flex-start}
.avatar{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;color:#fff;font-family:var(--f-display);font-size:17px}
.say{background:var(--sunken);border-radius:4px 16px 16px 16px;padding:10px 14px;font-weight:700;font-size:15px}
.say small{display:block;color:var(--muted);font-weight:700;font-size:12px;margin-bottom:2px}

.foot{border-top:2px solid var(--line);padding:14px 20px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.foot.right{background:var(--jade-soft);border-top-color:transparent}
.foot.wrong{background:var(--coral-soft);border-top-color:transparent}
.fb-head{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:21px;font-weight:800}
.foot.right .fb-head{color:var(--jade)} .foot.wrong .fb-head{color:var(--coral)}
.fb-head .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface)}
.fb-body{font-size:14px;font-weight:600}
.fb-body b{font-weight:800}
.foot.wrong .btn{background:var(--coral);box-shadow:0 4px 0 var(--coral-deep)}

/* ---------- result ---------- */
.result{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px 20px;text-align:center}
.result h2{font-size:30px;font-weight:800;color:var(--gold-deep)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.rt{border:2px solid;border-radius:16px;overflow:hidden;font-weight:800}
.rt .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#fff;padding:4px}
.rt .val{background:var(--surface);padding:12px 4px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:20px;font-variant-numeric:tabular-nums}
.rt.g{border-color:var(--gold)} .rt.g .lab{background:var(--gold)} .rt.g .val{color:var(--gold-deep)}
.rt.j{border-color:var(--jade)} .rt.j .lab{background:var(--jade)} .rt.j .val{color:var(--jade)}
.rt.s{border-color:var(--sky)} .rt.s .lab{background:var(--sky)} .rt.s .val{color:var(--sky)}
.streak-week{display:flex;gap:8px;justify-content:center}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:800;color:var(--muted)}
.day i{width:30px;height:30px;border-radius:50%;background:var(--locked);display:grid;place-items:center;color:#fff}
.day.on i{background:var(--gold)}
.day.today i{background:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
canvas.confetti{position:absolute;inset:0;pointer-events:none;width:100%;height:100%}

/* ---------- lists: leaderboard, quests, profile ---------- */
.page-h{padding:20px 20px 6px;display:flex;flex-direction:column;gap:6px}
.page-h h2{font-size:24px;font-weight:800}
.page-h p{color:var(--muted);font-weight:600;font-size:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;margin:10px 20px 4px;border:2px solid var(--line);border-radius:14px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:10px;padding:8px;font-weight:800;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sky-soft);color:var(--sky)}
.leagues{display:flex;gap:10px;justify-content:center;padding:14px 20px 4px}
.league{width:42px;height:46px;display:grid;place-items:center}
.league svg{width:42px;height:46px}
.league.dim{opacity:.35}
.lb{list-style:none;margin:0;padding:8px 12px 20px}
.lb li{display:flex;align-items:center;gap:12px;padding:10px 10px;border-radius:14px;font-weight:700}
.lb li.me{background:var(--sky-soft)}
.lb .rk{width:26px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted)}
.lb .rk.top{color:var(--gold-deep)}
.lb .who{flex:1;min-width:0}
.lb .who small{display:block;color:var(--muted);font-weight:600;font-size:12px}
.lb .pts{font-weight:800;font-variant-numeric:tabular-nums}
.zone{margin:0 22px;display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--jade)}
.zone::before,.zone::after{content:"";flex:1;height:2px;background:var(--jade-soft)}
.card{margin:12px 20px;border:2px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px}
.card h3{font-size:18px;font-weight:800}
.quest{display:flex;gap:12px;align-items:center}
.quest .qi{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.quest .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;font-weight:800;font-size:14px}
.qbar{height:16px;border-radius:999px;background:var(--locked);position:relative;overflow:hidden}
.qbar i{position:absolute;inset:0 auto 0 0;background:var(--gold);border-radius:999px;transition:width .4s}
.qbar span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.monthly{background:var(--sky);color:#fff;border:0;box-shadow:0 4px 0 var(--sky-deep)}
.monthly .qbar{background:rgba(255,255,255,.3)} .monthly .qbar span{color:#fff}
.prof-head{display:flex;align-items:center;gap:16px;padding:20px}
.prof-head .avatar{width:72px;height:72px;font-size:28px}
.prof-head small{color:var(--muted);font-weight:600;display:block}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px}
.sg{border:2px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center}
.sg b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.sg small{color:var(--muted);font-weight:700;font-size:12px}
.cert{display:flex;align-items:center;gap:14px}
.cert .body{flex:1;min-width:0}
.cert .body small{display:block;color:var(--muted);font-weight:600;font-size:12px}
.donut{width:48px;height:48px;flex:none}
.section-label{padding:16px 20px 0;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ---------- practice (roleplay) ---------- */
.persona{display:flex;gap:12px;align-items:center}
.persona small{display:block;color:var(--muted);font-weight:600;font-size:12px}
.thread{display:flex;flex-direction:column;gap:10px;padding:4px 20px 12px}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;font-weight:600;font-size:14px}
.msg.them{background:var(--sunken);border-top-left-radius:4px;align-self:flex-start}
.msg.me{background:var(--sky);color:#fff;border-top-right-radius:4px;align-self:flex-end}
.msg.me mark{background:rgba(255,255,255,.28);color:#fff;border-radius:4px;padding:0 2px}
.coach{border-color:var(--gold);background:var(--gold-soft)}
.coach h3{display:flex;align-items:center;gap:8px}
.score{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px;font-weight:700;align-items:center}
.score .pips{display:flex;gap:3px}
.score .pips i{width:12px;height:12px;border-radius:3px;background:var(--line)}
.score .pips i.on{background:var(--jade)}
.score .pips.warn i.on{background:var(--gold-deep)}
.tipline{font-size:13px;font-weight:600;border-top:2px dashed var(--gold);padding-top:10px}
.compose{display:flex;gap:8px;padding:10px 16px;border-top:2px solid var(--line)}
.compose input{flex:1;min-width:0;border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--sunken);font:inherit;color:var(--ink)}
.compose .btn{width:auto;padding:10px 14px}

/* ---------- modal / sheet ---------- */
.scrim{position:absolute;inset:0;background:rgba(8,20,16,.55);display:flex;align-items:flex-end;z-index:20}
.sheet{width:100%;background:var(--surface);border-radius:24px 24px 0 0;padding:24px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;animation:up .22s ease-out}
.sheet h3{font-size:22px;font-weight:800}
.sheet p{color:var(--muted);font-weight:600}
.sheet .wide{width:100%;display:flex;flex-direction:column;gap:10px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.course-list{width:100%;display:flex;flex-direction:column;gap:8px;text-align:left}
.course-row{display:flex;gap:12px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface)}
.course-row[aria-pressed="true"]{border-color:var(--jade);background:var(--jade-soft)}
.course-row .fund{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;flex:none}
.course-row .body{flex:1;min-width:0;font-weight:800}
.course-row small{display:block;color:var(--muted);font-weight:600;font-size:12px}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

function renderIndex(){
  let n=0;
  document.getElementById('flowIndex').innerHTML = FLOWS.map(g=>`

    ${g.items.map(([k,l])=>`<button class="flow-link" data-jump="${k}" aria-current="${isCurrent(k)}"><span class="n">${++n}</span>${l}</button>`).join('')}
    </div>`).join('');
}
function isCurrent(k){
  if(k.startsWith('lesson:')) return S.screen==='lesson' && S.lesson && S.lesson.order[S.lesson.pos]===+k.split(':')[1] && !S.modal;
  if(k==='hearts') return S.modal==='hearts';
  if(['learn','practice','leaderboard','quests','profile'].includes(k)) return S.screen==='main' && S.tab===k && !S.modal;
  return S.screen===k && !S.modal;
}
document.getElementById('flowIndex').addEventListener('click',e=>{
  const b=e.target.closest('[data-jump]'); if(!b) return;

  if(k.startsWith('lesson:')){ startLesson(+k.split(':')[1]); }
  else if(k==='hearts'){ if(S.screen!=='lesson') startLesson(1); S.lesson.hearts=0; S.modal='hearts'; }

  else if(['learn','practice','leaderboard','quests','profile'].includes(k)){ S.screen='main'; S.tab=k; }
  else S.screen=k;
  render();
});

/* ---------- lesson engine ---------- */
function startLesson(at=0){
  const n=LESSON.questions.length;
  S.lesson={order:[...Array(n).keys()].slice(at).concat([...Array(at).keys()]), pos:0, hearts:S.hearts||5, answer:null, checked:null,
    mistakes:new Set(), solved:new Set(), match:{sel:null, done:{}, bad:null, errors:0}, t0:Date.now()};
  S.screen='lesson'; S.modal=null; S.popover=null;
}
function curQ(){ return LESSON.questions[S.lesson.order[S.lesson.pos]]; }
function vLesson(){
  const L=S.lesson, q=curQ(), qi=L.order[L.pos];
  const pct=Math.round(L.solved.size/LESSON.questions.length*100);
  let body='';
  const sel = i => L.answer===i;
  const lock = L.checked ? 'disabled' : '';
  const optCls = i => !L.checked ? '' : (i===q.answer ? 'right' : (sel(i)?'wrong':''));
  if(q.type==='select'){
    body=`${q.ctx?`<div class="ctx">${q.ctx}</div>`:''}<div class="opts">${q.options.map((o,i)=>`
      <button class="opt ${optCls(i)}" data-ans="${i}" aria-pressed="${sel(i)}" ${lock}><span class="key">${i+1}</span><span>${o}</span></button>`).join('')}</div>`;
  } else if(q.type==='tf'){
    const c=v=>!L.checked?'':(v===q.answer?'right':(L.answer===v?'wrong':''));
    body=`<div class="ctx" style="font-size:16px">“${q.prompt}”</div><div class="tf">
      <button class="opt ${c(true)}" data-ans="true" aria-pressed="${L.answer===true}" ${lock} style="color:var(--jade)">${ic('check')}Đúng</button>
      <button class="opt ${c(false)}" data-ans="false" aria-pressed="${L.answer===false}" ${lock} style="color:var(--coral)">${ic('x')}Sai</button></div>`;
  } else if(q.type==='match'){
    const M=L.match, doneR=Object.values(M.done);
    body=`<div class="match"><div class="col">${q.left.map((t,i)=>`<button class="tile ${M.done[i]!==undefined?'ok':''} ${M.bad&&M.bad[0]===i?'bad':''}" data-ml="${i}" aria-pressed="${M.sel===i}" ${M.done[i]!==undefined?'disabled':''}>${t}</button>`).join('')}</div>
      <div class="col">${q.right.map((t,j)=>`<button class="tile ${doneR.includes(j)?'ok':''} ${M.bad&&M.bad[1]===j?'bad':''}" data-mr="${j}" ${doneR.includes(j)?'disabled':''}>${t}</button>`).join('')}</div></div>
      <p class="src">Chọn một ô bên trái, rồi chọn ô tương ứng bên phải.</p>`;
  } else if(q.type==='calc'){
    body=`<div class="ctx">${q.ctx}</div><div class="calc"><label class="calc-row" for="calcIn"><input id="calcIn" inputmode="decimal" autocomplete="off" placeholder="0,00" value="${L.answer??''}" ${lock}><span>${q.unit}</span></label><p class="hint">${q.hint}</p></div>`;
  } else if(q.type==='scenario'){
    body=`<div class="chat"><div class="avatar" style="background:var(--coral)">H</div><div class="say"><small>${q.who} · ${q.meta}</small>${q.says}</div></div>
      <div class="opts">${q.options.map((o,i)=>`<button class="opt ${optCls(i)}" data-ans="${i}" aria-pressed="${sel(i)}" ${lock}><span class="key">${String.fromCharCode(65+i)}</span><span>${o}</span></button>`).join('')}</div>`;
  }
  const isRetry = L.mistakes.has(qi) && !L.checked;
  const heading = q.type==='tf' ? '' : `<h2>${q.prompt}</h2>`;
  return `<div class="lesson-top"><button class="iconbtn" data-modal="exit" aria-label="Thoát bài học">${ic('x')}</button>
      <div class="bar"><i style="width:${Math.max(pct,3)}%"></i></div>
      <span class="stat heart">${ic('heart')}${L.hearts}</span></div>
    <div class="scroll"><div class="q"><div class="q-kind" style="${isRetry?'color:var(--coral)':''}">${isRetry?'Làm lại câu sai':q.kind}</div>${heading}${body}</div></div>
    ${vFoot(q)}`;
}
function vFoot(q){
  const L=S.lesson;
  if(!L.checked){
    let ready = L.answer!==null && L.answer!=='';
    if(q.type==='match') ready = Object.keys(L.match.done).length===q.left.length;
    return `<div class="foot"><button class="btn" data-act="check" ${ready?'':'disabled'}>Kiểm tra</button></div>`;
  }
  const ok=L.checked==='right';
  let correctText='';
  if(!ok){
    if(q.type==='tf') correctText = q.answer?'Đúng':'Sai';
    else if(q.type==='calc') correctText = `${q.display} ${q.unit}`;
    else correctText = q.options[q.answer];
  }
  const praise = ['Chính xác!','Tuyệt vời!','Rất tốt!'][L.pos%3];
  return `<div class="foot ${ok?'right':'wrong'}" role="status">
    <div class="fb-head"><span class="dot">${ic(ok?'check':'x')}</span>${ok?praise:'Chưa đúng'}</div>
    <div class="fb-body">${ok?'':`<p style="margin-bottom:6px">Đáp án đúng: <b>${correctText}</b></p>`}<p>${q.explain}</p></div>
    <div class="src">${ic('doc','ico')}Nguồn: <b>${q.src}</b></div>
    <button class="btn" data-act="next">Tiếp tục</button></div>`;
}
function grade(){
  const L=S.lesson,q=curQ(),qi=L.order[L.pos];let ok;
  if(q.type==='calc'){ const v=parseFloat(String(L.answer).replace(/\s/g,'').replace(',','.')); ok=Math.abs(v-q.answer)<=q.tol; }
  else if(q.type==='match'){ ok = true; }
  else ok = L.answer===q.answer;
  if(q.type==='match' && L.match.errors>0) L.mistakes.add(qi);
  L.checked = ok?'right':'wrong';
  if(ok){ L.solved.add(qi); }
  else { L.mistakes.add(qi); L.hearts=Math.max(0,L.hearts-1); L.order.push(qi); }
}
function next(){
  const L=S.lesson;
  if(L.hearts===0){ S.modal='hearts'; return; }
  L.pos++; L.answer=null; L.checked=null; L.match={sel:null,done:{},bad:null,errors:0};
  if(L.pos>=L.order.length) finishLesson();
}
function finishLesson(){
  const L=S.lesson, n=LESSON.questions.length, perfect=L.mistakes.size===0;
  const secs=Math.round((Date.now()-L.t0)/1000);
  const xp = 15 + (perfect?5:0);
  S.result={xp, acc:Math.round((n-L.mistakes.size)/n*100), time:`${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}`, perfect};
  if(!S.lessonDone){ S.streak++; }
  S.lessonDone=true; S.xp+=xp; S.weekXp+=xp; S.hearts=L.hearts;
  S.quests.xp=Math.min(20,S.quests.xp+xp); if(perfect) S.quests.perfect=1;
  if(!L.mistakes.has(5)) S.quests.scenario=1;
  S.screen='result';
}

function confetti(){
  const c=document.getElementById('confetti'); if(!c||matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const r=c.getBoundingClientRect(); c.width=r.width; c.height=r.height; const x=c.getContext('2d');
  const cs=getComputedStyle(document.documentElement); const cols=['--jade','--gold','--sky','--coral'].map(v=>cs.getPropertyValue(v).trim());
  const P=Array.from({length:90},()=>({x:r.width/2,y:r.height*0.3,vx:(Math.random()-.5)*9,vy:Math.random()*-9-3,s:Math.random()*6+4,c:cols[Math.random()*4|0],a:Math.random()*6}));
  let f=0;(function t(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.28;p.x+=p.vx;p.y+=p.vy;p.a+=.15;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore();});if(++f<110&&document.getElementById('confetti')===c)requestAnimationFrame(t);else x.clearRect(0,0,c.width,c.height);})();
}

    <div class="section-label">Cần ôn lại</div>
    <div class="card">
      <div class="cert"><span style="color:var(--coral)">${ic('flag')}</span><div class="body"><b>Phí bán khi mua nhiều đợt</b><small>Sai 2 lần trong 7 ngày · FAQ câu 10</small></div></div>
      <div class="cert"><span style="color:var(--coral)">${ic('flag')}</span><div class="body"><b>Ngày T và thời điểm công bố NAV</b><small>Sai 1 lần · FAQ câu 12</small></div></div>
      <button class="btn sky" data-start="0">Ôn tập nhanh 3 phút</button>
    </div>
    <div style="height:12px"></div>
  </div>${tabBar()}`;
}

  return `${statusBar()}<div class="scroll">
    <div class="page-h"><span class="chip" style="align-self:flex-start;background:var(--gold-soft);color:var(--gold-deep)">${ic('sparkle','ico')} Giai đoạn 2 · bản xem trước</span><h2>Luyện tình huống</h2><p>Khách hàng do AI đóng vai. Bạn trả lời, huấn luyện viên chấm theo FAQ, kịch bản tư vấn và quy định tuân thủ.</p></div>
    <div class="card"><div class="persona"><span class="avatar" style="background:var(--coral)">L</span><div><b>Chị Lan, 45 tuổi</b><small>Giữ DCDS 8 tháng · đang lỗ nhẹ · lo thị trường giảm</small></div></div></div>
    <div class="thread">
      <div class="msg them">Thị trường cứ giảm hoài em ạ. Chị có nên bán DCDS luôn không, giữ thêm có chắc lời không em?</div>
      <div class="msg me">Dạ em hiểu chị lo ạ. DCDS hợp với đầu tư từ 12–18 tháng trở lên, nhịp điều chỉnh ngắn hạn là bình thường. Nếu chị bán bây giờ, chị còn chịu phí bán 1,5% vì giữ chưa đủ 1 năm. <mark>Em chắc chắn quỹ sẽ lời 18–20% năm nay</mark> nên chị cứ yên tâm ạ.</div>
    </div>
    <div class="card coach">
      <h3>${ic('sparkle')}Nhận xét của huấn luyện viên</h3>
      <div class="score">
        <span>Đúng thông tin sản phẩm</span><span class="pips">${'<i class="on"></i>'.repeat(5)}</span>
        <span>Đồng cảm với khách</span><span class="pips">${'<i class="on"></i>'.repeat(4)}<i></i></span>
        <span>Tuân thủ</span><span class="pips warn">${'<i class="on"></i>'.repeat(2)}<i></i><i></i><i></i></span>
      </div>
      <p class="tipline"><b>Cần sửa:</b> không cam kết lợi nhuận. 18–20%/năm là kỳ vọng trong kịch bản tư vấn, không phải lời hứa, và hiệu quả quá khứ không bảo đảm cho tương lai. Thử nói: “Kỳ vọng dài hạn của quỹ là…, nhưng em không thể cam kết mức lợi nhuận ạ.”</p>
      <p class="src">${ic('doc','ico')}Nguồn: <b>Kịch bản tư vấn T7/2025 · Disclaimer báo cáo quỹ</b></p>
    </div>
  </div>
  <div class="compose"><input id="rpIn" placeholder="Viết lại câu trả lời…" aria-label="Câu trả lời của bạn"><button class="btn sky" disabled>Gửi</button></div>
  ${tabBar()}`;
}

/* ---------- modals ---------- */
function vModal(){
  if(S.modal==='exit') return `<div class="scrim" data-close><div class="sheet">${mascot(90,'sad')}<h3>Khoan đã, đừng bỏ cuộc!</h3><p>Bạn sẽ mất tiến độ của bài học này.</p><div class="wide"><button class="btn" data-close>Học tiếp</button><button class="linkbtn" style="color:var(--coral)" data-go="learn">Kết thúc bài</button></div></div></div>`;
  if(S.modal==='hearts') return `<div class="scrim"><div class="sheet">${mascot(90,'sad')}<h3>Bạn đã hết tim</h3><p>Ôn lại những câu vừa sai để hồi 1 tim, hoặc chờ 4 giờ để tim đầy lại.</p><div class="wide"><button class="btn sky" data-act="refill">Ôn câu sai · +1 tim</button><button class="linkbtn" data-go="learn">Để sau</button></div></div></div>`;
  if(S.modal==='courses') return `<div class="scrim" data-close><div class="sheet"><h3>Khoá học</h3><div class="course-list">${COURSES.map((c,i)=>`<button class="course-row" aria-pressed="${i===0}" data-close><span class="fund" style="background:${c.color}">${c.code}</span><span class="body">${c.name}<small>${c.sub}</small></span>${donut(i===0&&S.lessonDone?50:c.pct,c.color)}</button>`).join('')}</div></div></div>`;
  if(S.modal==='guide') return `<div class="scrim" data-close><div class="sheet" style="text-align:left;align-items:stretch"><h3>Ghi chú Phần 1</h3>
    <div class="ctx"><b>NAV</b> = tổng tài sản − nợ phải trả. NAV/CCQ là giá mỗi chứng chỉ quỹ.</div>
    <div class="ctx"><b>Ngân hàng giám sát</b> (Standard Chartered) kiểm tra tiền NĐT được dùng đúng mục đích và giá NAV được tính đúng.</div>
    <div class="ctx"><b>Ngày T:</b> đặt lệnh trước 14:30 ngày T-1, khớp theo NAV kỳ T, công bố 12h ngày T.</div>
    <button class="btn" data-close>Đã hiểu</button></div></div>`;
  return '';
}

/* ---------- render ---------- */
function render(){
  let html='';
  if(S.screen==='welcome') html=vWelcome();
  else if(S.screen==='role') html=vRole();
  else if(S.screen==='goal') html=vGoal();
  else if(S.screen==='lesson') html=vLesson();
  else if(S.screen==='result') html=vResult();
  else html={learn:vLearn,practice:vPractice,leaderboard:vLeaderboard,quests:vQuests,profile:vProfile}[S.tab]();
  app.innerHTML = html + vModal();
  renderIndex();
  if(S.screen==='result') confetti();
  const ci=document.getElementById('calcIn'); if(ci&&!S.lesson.checked){ ci.focus(); ci.setSelectionRange(ci.value.length,ci.value.length); }
}

app.addEventListener('input',e=>{
  if(e.target.id==='calcIn'){ S.lesson.answer=e.target.value; const b=app.querySelector('[data-act="check"]'); if(b) b.disabled=!e.target.value.trim(); }
});
app.addEventListener('keydown',e=>{
  if(e.key==='Enter' && S.screen==='lesson'){ const b=app.querySelector('[data-act="check"]:not([disabled]),[data-act="next"]'); if(b){ e.preventDefault(); b.click(); } }
});
app.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-close]');
  if(!t) { if(S.popover){ S.popover=null; render(); } return; }
  const d=t.dataset;
  if(d.close!==undefined && (t.tagName==='BUTTON' || e.target===t)){ S.modal=null; render(); return; }
  if(d.close!==undefined) return;
  if(d.go){
    S.modal=null; S.popover=null;
    if(d.go==='learn'){ S.screen='main'; S.tab='learn'; }
    else if(d.go==='quests-tab'){ S.screen='main'; S.tab='quests'; }
    else S.screen=d.go;
    return render();
  }
  if(d.role){ S.role=d.role; return render(); }
  if(d.goal){ S.goal=+d.goal; return render(); }
  if(d.tab){ S.tab=d.tab; S.popover=null; return render(); }
  if(d.modal){ S.modal=d.modal; return render(); }
  if(d.lb){ S.lbMode=d.lb; return render(); }
  if(d.node){ S.popover = S.popover===d.node?null:d.node; return render(); }
  if(d.start!==undefined){ startLesson(+d.start); return render(); }
  if(S.screen==='lesson'){
    const L=S.lesson;
    if(d.ans!==undefined && !L.checked){ L.answer = d.ans==='true'?true:d.ans==='false'?false:+d.ans; return render(); }
    if(d.ml!==undefined){ L.match.sel=+d.ml; L.match.bad=null; return render(); }
    if(d.mr!==undefined && L.match.sel!==null){
      const q=curQ(), l=L.match.sel, r=+d.mr;
      if(q.pairs[l]===r){ L.match.done[l]=r; L.match.sel=null; L.match.bad=null; }
      else { L.match.bad=[l,r]; L.match.errors++; L.match.sel=null; }
      return render();
    }
    if(d.act==='check'){ grade(); return render(); }
    if(d.act==='next'){ next(); return render(); }
    if(d.act==='refill'){ L.hearts=1; S.modal=null; next(); return render(); }
  }
});
document.addEventListener('keydown',e=>{
  if(S.screen!=='lesson'||S.lesson.checked||S.modal) return;
  const q=curQ(); if(!(q.type==='select'||q.type==='scenario')) return;
  const n=+e.key; if(n>=1&&n<=q.options.length){ S.lesson.answer=n-1; render(); }
});

render();
})();
</script>
